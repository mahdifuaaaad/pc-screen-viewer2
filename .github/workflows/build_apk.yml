name: Build NexusCast Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Linux & Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            lld libltdl-dev

      - name: 4. Generate buildozer.spec with Bundled Libraries
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = NexusCast Receiver
          package.name = nexuscast
          package.domain = org.nexuscast
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0.0

          requirements = python3,kivy==2.3.0,pillow,pyjnius,android

          orientation = landscape
          fullscreen = 0

          android.permissions = INTERNET,ACCESS_NETWORK_STATE,ACCESS_WIFI_STATE,CHANGE_WIFI_MULTICAST_STATE,WAKE_LOCK
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a, armeabi-v7a
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: 5. Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-cache-${{ runner.os }}-v1

      - name: 6. Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: 7. Compile APK with All Libraries Inside
        run: |
          buildozer android debug

      - name: 8. Upload Ready APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusCast-Mobile-APK
          path: bin/*.apk
