name: Build NexusCast Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install System Dependencies & 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            lld libltdl-dev patch libstdc++6:i386 zlib1g:i386

      - name: 4. Generate Fully Corrected buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = NexusCast Receiver
          package.name = nexuscast
          package.domain = org.nexuscast
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 1.0.0

          requirements = python3,kivy==2.3.0,pillow

          orientation = landscape
          fullscreen = 0

          android.permissions = INTERNET,ACCESS_NETWORK_STATE,ACCESS_WIFI_STATE,CHANGE_WIFI_MULTICAST_STATE,WAKE_LOCK
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: 5. Clean & Setup Buildozer Environment
        run: |
          rm -rf .buildozer
          pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36

      - name: 6. Run Buildozer with Auto-Accept & Debug
        run: |
          yes | buildozer -v android debug

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusCast-Mobile-APK
          path: bin/*.apk
